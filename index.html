<!doctype html>

<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Rutas Seguras Kids</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/styles.css" />

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- HEADER -->

    <header class="hero">
      <div class="overlay">
        <h1>🚌 Rutas Seguras Kids</h1>
        <nav>
          <ul>
            <a class="a-encabezado" href="filtrar.html">
              <li>Filtrar Rutas</li>
            </a>
          </ul>
        </nav>
        <p>Gestión inteligente de rutas escolares</p>
      </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->

    <main class="container">
      <!-- FORMULARIO -->

      <section class="form-section">
        <div class="form-card">
          <h2>➕ Crear Nueva Ruta</h2>

          <form id="routeForm">
            <div class="input-group">
              <label> Nombre Ruta </label>

              <input
                type="text"
                id="nombreRuta"
                placeholder="Ej: Ruta Norte"
                required
              />
            </div>

            <div class="input-group">
              <label> Conductor </label>

              <input
                type="text"
                id="conductor"
                placeholder="Nombre conductor"
                required
              />
            </div>

            <div class="input-group">
              <label> Hora de salida </label>

              <input type="time" id="hora" required />
            </div>

            <div class="input-group">
              <label> Ciudad </label>

              <input type="text" id="ciudad" placeholder="Ciudad" required />
            </div>

            <button type="submit">Crear Ruta</button>
          </form>
        </div>
      </section>

      <!-- RUTAS -->
      <br />
      <br />
      <section class="routes-section">
        <div class="section-title">
          <h2>📍 Rutas Registradas</h2>
        </div>

        <section id="routesContainer"></section>
      </section>
    </main>
    <br />
    <br />
    <br />
    <br />
    <br />
    <footer>
      <h3 class="footer-title">🚌 Rutas Seguras Kids</h3>

      <p>Sistema inteligente para la gestión de rutas escolares.</p>

      <p>
        Desarrollado por
        <strong>Sergio Pinto</strong>
      </p>

      <p>
        <strong>2026 ®</strong>
      </p>

      <div class="socials">
        <a href="#"> 🌐 </a>

        <a href="#"> 💻 </a>

        <a href="#"> 📧 </a>
      </div>
    </footer>
    <!-- SCRIPTS -->

    <script src="js/localstorage.js"></script>

    <script src="js/weather.js"></script>

    <script src="js/routecard.js"></script>

    <script src="js/app.js"></script>
  </body>
</html>
